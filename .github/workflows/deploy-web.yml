name: Deploy web app (GitHub Pages)
# Publishes the built app to GitHub Pages from main. For a private repo this needs a paid GitHub plan;
# otherwise use any static host (Azure Static Web Apps, Netlify, Vercel) with the same `web/dist` folder.
# Manual only for now (Kimberley is choosing between GitHub Pages and Azure Static Web Apps).
# To use Pages: Settings > Pages > Source = GitHub Actions, then put the push trigger back.
on:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - uses: actions/deploy-pages@v4
