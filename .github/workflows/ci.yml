name: CI
# Runs on every push and pull request: database tests, type check, unit tests, build, end-to-end tests.
on: [push, pull_request]
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Database tests (throwaway Postgres)
        run: bash scripts/test-db.sh   # 'bash' so it runs even if the file lost its executable bit on Windows
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
