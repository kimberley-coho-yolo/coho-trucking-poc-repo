name: Deploy web app (Azure Static Web Apps)
# Builds web/ and uploads web/dist to Azure Static Web Apps on every push to main.
# Does nothing (and does not fail) until the repo secret AZURE_STATIC_WEB_APPS_API_TOKEN exists.
# Get the token in the Azure portal: your Static Web App > Overview > Manage deployment token.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Check Azure token is set
        run: |
          if [ -z "$SWA_TOKEN" ]; then echo "AZURE_STATIC_WEB_APPS_API_TOKEN not set yet: skipping deploy."; fi
      - uses: actions/checkout@v4
        if: env.SWA_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.SWA_TOKEN != ''
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build
        if: env.SWA_TOKEN != ''
        working-directory: web
        run: npm ci && npm run build
      - name: Upload to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
