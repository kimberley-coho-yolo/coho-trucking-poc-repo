# Minimal Supabase CLI config so `supabase link` / `supabase db push` and local `supabase start` work.
project_id = "coho-trucking-poc"
[db]
major_version = 17
[auth]
site_url = "http://localhost:5173"
[auth.sms]
enable_signup = true
# Do NOT add [auth.sms.test_otp] here: if this file is deployed to the hosted project,
# a fixed test code would let anyone sign in as that number. Set test numbers in the dashboard only, and remove them after testing.

# Supabase Auth calls this function as the Send SMS hook. It checks the hook signature itself, so it
# must not require a user JWT.
[functions.send-sms]
verify_jwt = false
